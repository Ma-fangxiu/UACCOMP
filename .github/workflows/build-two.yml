name: Build & Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/**'
  
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.0.0)'
        required: true
        type: string
      release:
        description: '是否创建 GitHub Release'
        required: true
        type: boolean
        default: true
      draft:
        description: '是否为草稿 Release'
        required: true
        type: boolean
        default: true

env:
  PLUGIN_NAME: UACComp  # 插件名称（前缀）

jobs:
  build:
    runs-on: windows-2022
    name: Build Plugin
    
    outputs:
      version: ${{ steps.build-step.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Package
        id: build-step
        shell: pwsh
        run: |
          # 查找项目文件
          $csproj = Get-ChildItem -Path . -Filter "*.csproj" -Recurse | Select-Object -First 1
          if (-not $csproj) {
            Write-Error "❌ 未找到 .csproj 文件"
            exit 1
          }
          Write-Host "📄 项目: $($csproj.FullName)" -ForegroundColor Gray
          
          # 获取版本号
          if ("${{ github.event.inputs.version }}") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            [xml]$proj = Get-Content $csproj.FullName
            $version = $proj.Project.PropertyGroup.Version
          }
          Write-Host "🔖 版本: $version" -ForegroundColor Cyan
          echo "version=$version" >> $env:GITHUB_OUTPUT
          
          # 创建临时输出目录
          $OutputPath = "./output"
          if (Test-Path $OutputPath) {
            Remove-Item $OutputPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $OutputPath -Force | Out-Null
          
          # 还原依赖
          Write-Host "📦 还原 NuGet 包..." -ForegroundColor Yellow
          dotnet restore $csproj.FullName
          if ($LASTEXITCODE -ne 0) { throw "还原失败" }
          
          # 构建
          Write-Host "🔨 编译项目..." -ForegroundColor Yellow
          dotnet build $csproj.FullName -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "构建失败" }
          
          # 发布到临时目录
          $PublishPath = "$OutputPath/publish"
          Write-Host "📤 发布项目到 $PublishPath..." -ForegroundColor Yellow
          dotnet publish $csproj.FullName `
            -c Release `
            --no-build `
            -o $PublishPath
          if ($LASTEXITCODE -ne 0) { throw "发布失败" }
          
          # 定义需要打包的文件列表（基于 PLUGIN_NAME）
          $pluginName = "${{ env.PLUGIN_NAME }}"
          $filesToPack = @(
            "$PublishPath/$pluginName.pdb",
            "$PublishPath/$pluginName.dll",
            "$PublishPath/$pluginName.deps.json",
            "$PublishPath/README.md",
            "$PublishPath/manifest.yml",
            "$PublishPath/icon.png"
          )
          
          # 检查文件是否存在
          Write-Host ""
          Write-Host "📂 检查需要打包的文件：" -ForegroundColor Cyan
          $existingFiles = @()
          foreach ($file in $filesToPack) {
            if (Test-Path $file) {
              $item = Get-Item $file
              $size = if ($item.Length -lt 1KB) { "$($item.Length) B" } 
                      elseif ($item.Length -lt 1MB) { "{0:F2} KB" -f ($item.Length/1KB) }
                      else { "{0:F2} MB" -f ($item.Length/1MB) }
              Write-Host "   ✅ $(Split-Path $file -Leaf) ($size)" -ForegroundColor Green
              $existingFiles += $file
            } else {
              Write-Host "   ❌ $(Split-Path $file -Leaf) - 不存在" -ForegroundColor Red
            }
          }
          
          if ($existingFiles.Count -eq 0) {
            throw "没有找到任何要打包的文件！"
          }
          
          # 创建临时目录存放要打包的文件（保持根目录结构）
          $PackTempPath = "$OutputPath/pack_temp"
          New-Item -ItemType Directory -Path $PackTempPath -Force | Out-Null
          
          # 复制文件到临时目录
          foreach ($file in $existingFiles) {
            Copy-Item $file $PackTempPath/
          }
          
          # 打包为 .cipx
          Write-Host ""
          Write-Host "📦 正在打包为 .cipx..." -ForegroundColor Yellow
          $zipPath = "$OutputPath/$pluginName.zip"
          $cipxPath = "$OutputPath/$pluginName.cipx"
          
          Compress-Archive -Path "$PackTempPath/*" -DestinationPath $zipPath -Force
          Rename-Item $zipPath $cipxPath
          
          # 清理临时目录
          Remove-Item $PublishPath -Recurse -Force
          Remove-Item $PackTempPath -Recurse -Force
          
          # 显示结果
          $cipxSize = (Get-Item $cipxPath).Length
          $cipxSizeStr = if ($cipxSize -lt 1KB) { "$cipxSize B" } 
                         elseif ($cipxSize -lt 1MB) { "{0:F2} KB" -f ($cipxSize/1KB) }
                         else { "{0:F2} MB" -f ($cipxSize/1MB) }
          Write-Host ""
          Write-Host "✅ 打包完成：$pluginName.cipx ($cipxSizeStr)" -ForegroundColor Green

      # 上传 CIPX 文件
      - 名字: Upload CIPX Artifact
        uses: actions/upload-artifact@v4
        with:
          名字: ${{ env.PLUGIN_NAME }}_cipx
          path: ./output/*.cipx
          if-no-files-found: error
          retention-days: 30

  release:
    runs-on: windows-2022
    名字: Create Release
    needs: build
    if: ${{ github.event.inputs.release == true && github.event_name == 'workflow_dispatch' }}
    
    permissions:
      contents: 撰写
    
    steps:
      - 名字: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - 名字: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: ${{ env.PLUGIN_NAME }}_*
          merge-multiple: true

      - 名字: Generate Release Note
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $changelogPath = "./changelog/${version}.md"
          
          $md5Summary = @"
          
          ## 文件校验
          
          > [!important]
          > 下载后请校验文件 MD5 值，确保文件完整性。
          
          | 文件名 | MD5 |
          |--------|-----|
          "@
          
          $hashes = [ordered]@{}
          
          Get-ChildItem ./artifacts -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm MD5
            $md5Summary += "`n| $($_.Name) | ``$($hash.Hash)`` |"
            $hashes.Add($_.Name, $hash.Hash)
          }
          
          $json = ConvertTo-Json $hashes -Compress
          $md5Summary += "`n`n<!-- CLASSISLAND_PKG_MD5 ${json} -->"
          
          if (Test-Path $changelogPath) {
            $changelog = Get-Content $changelogPath -Raw
          } else {
            $changelog = "## 版本 ${version}`n`n- 更新内容详见提交历史"
          }
          
          $fullContent = $changelog + "`n`n" + $md5Summary
          $fullContent | Out-File -FilePath "./release-note.md" -Encoding utf8
          
          Write-Host "生成的发布说明：" -ForegroundColor Gray
          Get-Content "./release-note.md"

      - 名字: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./artifacts/*"
          tag: v${{ needs.build.outputs.version }}
          名字: ${{ env.PLUGIN_NAME }} v${{ needs.build.outputs.version }}
          bodyFile: ./release-note.md
          草案: ${{ github.event.inputs.draft }}
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: false
