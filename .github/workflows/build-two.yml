name: Build and Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/**'
  
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.0.0)'
        required: true
        type: string
      release:
        description: '是否创建 GitHub Release'
        required: true
        type: boolean
        default: true
      draft:
        description: '是否为草稿 Release'
        required: true
        type: boolean
        default: true

env:
  PLUGIN_NAME: UACComp

jobs:
  build:
    runs-on: windows-2022
    name: Build Plugin
    
    outputs:
      version: ${{ steps.build-step.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Package
        id: build-step
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Path . -Filter "*.csproj" -Recurse | Select-Object -First 1
          if (-not $csproj) {
            Write-Error "未找到 .csproj 文件"
            exit 1
          }
          Write-Host "项目: $($csproj.FullName)"
          
          if ("${{ github.event.inputs.version }}") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            [xml]$proj = Get-Content $csproj.FullName
            $version = $proj.Project.PropertyGroup.Version
          }
          Write-Host "版本: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          
          $OutputPath = "./output"
          if (Test-Path $OutputPath) {
            Remove-Item $OutputPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $OutputPath -Force | Out-Null
          
          Write-Host "还原 NuGet 包..."
          dotnet restore $csproj.FullName
          if ($LASTEXITCODE -ne 0) { throw "还原失败" }
          
          Write-Host "编译项目..."
          dotnet build $csproj.FullName -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "构建失败" }
          
          $PublishPath = "$OutputPath/publish"
          Write-Host "发布项目..."
          dotnet publish $csproj.FullName -c Release --no-build -o $PublishPath
          if ($LASTEXITCODE -ne 0) { throw "发布失败" }
          
          $pluginName = "${{ env.PLUGIN_NAME }}"
          $filesToPack = @(
            "$PublishPath/$pluginName.pdb",
            "$PublishPath/$pluginName.dll",
            "$PublishPath/$pluginName.deps.json",
            "$PublishPath/README.md",
            "$PublishPath/manifest.yml",
            "$PublishPath/icon.png"
          )
          
          Write-Host "检查需要打包的文件："
          $existingFiles = @()
          foreach ($file in $filesToPack) {
            if (Test-Path $file) {
              Write-Host "  找到: $(Split-Path $file -Leaf)"
              $existingFiles += $file
            } else {
              Write-Host "  跳过: $(Split-Path $file -Leaf) (不存在)"
            }
          }
          
          if ($existingFiles.Count -eq 0) {
            throw "没有找到任何要打包的文件！"
          }
          
          $PackTempPath = "$OutputPath/pack_temp"
          New-Item -ItemType Directory -Path $PackTempPath -Force | Out-Null
          
          foreach ($file in $existingFiles) {
            Copy-Item $file $PackTempPath/
          }
          
          # 修复：使用绝对路径和正确的重命名方式
          $zipPath = Join-Path (Resolve-Path $OutputPath) "$pluginName.zip"
          $cipxPath = Join-Path (Resolve-Path $OutputPath) "$pluginName.cipx"
          
          Write-Host "打包文件..."
          Compress-Archive -Path "$PackTempPath/*" -DestinationPath $zipPath -Force
          
          Write-Host "重命名为 .cipx..."
          # 使用 Move-Item 代替 Rename-Item，并只指定新文件名
          Move-Item -Path $zipPath -Destination $cipxPath -Force
          
          Remove-Item $PublishPath -Recurse -Force
          Remove-Item $PackTempPath -Recurse -Force
          
          Write-Host "打包完成: $pluginName.cipx"

      - name: Upload CIPX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}_cipx
          path: ./output/*.cipx
          if-no-files-found: error
          retention-days: 30

  release:
    runs-on: windows-2022
    name: Create Release
    needs: build
    if: ${{ github.event.inputs.release == true && github.event_name == 'workflow_dispatch' }}
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: ${{ env.PLUGIN_NAME }}_*
          merge-multiple: true

      - name: Generate Release Note
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $changelogPath = "./changelog/${version}.md"
          
          $md5Summary = @"
          
          ## 文件校验
          
          > [!important]
          > 下载后请校验文件 MD5 值，确保文件完整性。
          
          | 文件名 | MD5 |
          |--------|-----|
          "@
          
          $hashes = [ordered]@{}
          
          Get-ChildItem ./artifacts -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm MD5
            $md5Summary += "`n| $($_.Name) | ``$($hash.Hash)`` |"
            $hashes.Add($_.Name, $hash.Hash)
          }
          
          $json = ConvertTo-Json $hashes -Compress
          $md5Summary += "`n`n<!-- CLASSISLAND_PKG_MD5 ${json} -->"
          
          if (Test-Path $changelogPath) {
            $changelog = Get-Content $changelogPath -Raw
          } else {
            $changelog = "## 版本 ${version}`n`n- 更新内容详见提交历史"
          }
          
          $fullContent = $changelog + "`n`n" + $md5Summary
          $fullContent | Out-File -FilePath "./release-note.md" -Encoding utf8
          
          Write-Host "生成的发布说明"
          Get-Content "./release-note.md"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./artifacts/*"
          tag: v${{ needs.build.outputs.version }}
          name: ${{ env.PLUGIN_NAME }} v${{ needs.build.outputs.version }}
          bodyFile: ./release-note.md
          draft: ${{ github.event.inputs.draft }}
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: false
