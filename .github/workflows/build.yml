name: Build Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (用于压缩包命名)'
        required: true
        default: '1.1.0.0'

env:
  PLUGIN_NAME: UACComp

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build project
        run: dotnet build --configuration Release --no-restore
      
      - name: Publish project
        run: dotnet publish --configuration Release --no-build --output ./publish
      
      # 压缩构建好的文件夹
      - name: Create zip archive
        run: |
          $zipName = "${{ env.PLUGIN_NAME }}-v${{ github.event.inputs.version }}.zip"
          Compress-Archive -Path ./publish/* -DestinationPath ./$zipName -Force
          Write-Host "✅ 已创建压缩包：$zipName"
          Get-ChildItem *.zip
      
      # 上传压缩包（可在 Actions 页面下载）
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-v${{ github.event.inputs.version }}
          path: ./*.zip
          if-no-files-found: error
          retention-days: 7
